<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:24px;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 20% 15%,rgba(131,58,180,.18),transparent 32%),
    radial-gradient(circle at 85% 85%,rgba(225,48,108,.13),transparent 30%),
    #101827;
  color:#fff; font-family:Inter,Arial,sans-serif;
}
.card{
  width:min(760px,100%);
  padding:38px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:28px;
  background:rgba(23,31,50,.94);
  box-shadow:0 30px 90px rgba(0,0,0,.42);
}
.profile{
  display:flex; align-items:center; gap:28px;
}
.avatar-ring{
  width:142px; height:142px; flex:0 0 142px;
  padding:4px; border-radius:50%;
  background:linear-gradient(135deg,#833ab4,#e1306c,#f77737);
  box-shadow:0 12px 35px rgba(225,48,108,.22);
}
.avatar{
  width:100%; height:100%; display:block;
  object-fit:cover; border-radius:50%;
  border:4px solid #171f32;
}
h1{margin:0 0 6px;font-size:38px;letter-spacing:-.6px}
.handle{font-size:22px;color:#b9c2d3}
.description{
  margin:30px 0 0;
  color:#e7eaf0;
  font-size:18px;
  line-height:1.55;
}
.button{
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:26px; padding:14px 24px;
  border-radius:14px;
  background:linear-gradient(135deg,#833ab4,#e1306c,#f77737);
  color:#fff; text-decoration:none; font-weight:700; font-size:17px;
  box-shadow:0 10px 28px rgba(225,48,108,.22);
  transition:opacity .22s ease,transform .22s ease,box-shadow .22s ease;
}
.button:hover{
  opacity:.82; transform:translateY(-2px);
  box-shadow:0 16px 34px rgba(225,48,108,.34);
}
.button:active{opacity:.68;transform:scale(.98)}
@media(max-width:600px){
  .card{padding:26px}
  .profile{gap:18px}
  .avatar-ring{width:105px;height:105px;flex-basis:105px}
  h1{font-size:29px}
  .handle{font-size:18px}
}
</style>
